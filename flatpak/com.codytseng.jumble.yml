app-id: moe.nostr.join
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: nostrmoe
separate-locales: false
finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  # Allow Chromium safeStorage to reach the Secret Service (gnome-keyring /
  # kwallet) so encrypted secrets persist across restarts.
  - --talk-name=org.freedesktop.secrets
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  append-path: /usr/lib/sdk/node24/bin
modules:
  - name: nostrmoe
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/nostrmoe/flatpak-node/cache
        npm_config_cache: /run/build/nostrmoe/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node24
        npm_config_offline: 'true'
    sources:
      - generated-sources.json
      - type: dir
        path: ..
        dest: main
        skip:
          - .git
          - .github
          - .claude
          - node_modules
          - dist
          - dist-electron
          - dev-dist
          - release
          - flatpak/.flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
      - type: file
        path: run.sh
      - type: file
        path: moe.nostr.join.desktop
      - type: file
        path: moe.nostr.join.metainfo.xml
      - type: file
        path: ../public/pwa-512x512.png
      - type: file
        path: ../public/pwa-192x192.png
    build-commands:
      - cd main && npm ci --offline
      - |
        . flatpak-node/electron-builder-arch-args.sh
        cd main
        npm run electron:build -- $ELECTRON_BUILDER_ARCH_ARGS --linux --dir --publish never
      - install -d /app/nostrmoe
      - cp -a main/release/*/linux*unpacked/. /app/nostrmoe/
      - if [ -x /app/nostrmoe/Nostr!moe ] && [ ! -e /app/nostrmoe/nostrmoe ]; then ln -s Nostr!moe /app/nostrmoe/nostrmoe; fi
      - install -Dm755 run.sh /app/bin/nostrmoe
      - install -Dm644 moe.nostr.join.desktop /app/share/applications/moe.nostr.join.desktop
      - install -Dm644 moe.nostr.join.metainfo.xml /app/share/metainfo/moe.nostr.join.metainfo.xml
      - install -Dm644 pwa-512x512.png /app/share/icons/hicolor/512x512/apps/moe.nostr.join.png
      - install -Dm644 pwa-192x192.png /app/share/icons/hicolor/192x192/apps/moe.nostr.join.png
